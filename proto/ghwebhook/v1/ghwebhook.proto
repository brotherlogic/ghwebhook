syntax = "proto3";

package ghwebhook.v1;

option go_package = "github.com/brotherlogic/ghwebhook/proto/ghwebhook/v1";

// RegistrationService handles service check-ins.
service RegistrationService {
    // Register a service for a specific repository.
    rpc Register(RegistrationRequest) returns (RegistrationResponse);
    // Unregister a service for a specific repository.
    rpc Unregister(UnregisterRequest) returns (UnregisterResponse);
}

// WebhookHandler is the service implemented by clients to receive webhooks.
service WebhookHandler {
    // ReceiveWebhook is called by the proxy when a webhook is received.
    rpc ReceiveWebhook(WebhookEvent) returns (WebhookResponse);
}

message RegistrationRequest {
    string repo_full_name = 1; // e.g., "owner/repo"
    string service_address = 2; // e.g., "service.namespace.svc:50051"
}

message RegistrationResponse {
    bool success = 1;
    string message = 2;
}

message UnregisterRequest {
    string repo_full_name = 1; // e.g., "owner/repo"
    string service_address = 2; // e.g., "service.namespace.svc:50051"
}

message UnregisterResponse {
    bool success = 1;
    string message = 2;
}

message WebhookResponse {
    bool success = 1;
    string message = 2;
}

message WebhookEvent {
    EventHeader header = 1;
    oneof payload {
        PullRequestEvent pull_request = 2;
        IssueEvent issue = 3;
        PushEvent push = 4;
        PullRequestReviewEvent pull_request_review = 5;
        CheckSuiteEvent check_suite = 6;
    }
}

message EventHeader {
    string event_type = 1; // e.g., "pull_request"
    int64 received_at_ms = 2; // Proxy timestamp
}

message PullRequestEvent {
    string action = 1;
    int32 number = 2;
    string title = 3;
    string body = 4;
    User user = 5;
    Repository repository = 6;
    bool merged = 7;
    string head_ref = 8;
    string head_sha = 9;
    string base_ref = 10;
    string state = 11;
}

message IssueEvent {
    string action = 1;
    int32 number = 2;
    string title = 3;
    string body = 4;
    User user = 5;
    Repository repository = 6;
    repeated string labels = 7;
    string state = 8;
}

message PushEvent {
    string ref = 1;
    string before = 2;
    string after = 3;
    User sender = 4;
    Repository repository = 5;
}

message PullRequestReviewEvent {
    string action = 1;
    string state = 2; // e.g., "approved", "changes_requested", "commented"
    string commit_id = 3;
    User reviewer = 4;
    int32 pull_request_number = 5;
    Repository repository = 6;
}

message CheckSuiteEvent {
    string action = 1;
    string status = 2;
    string conclusion = 3; // e.g., "success", "failure"
    string head_branch = 4;
    string head_sha = 5;
    Repository repository = 6;
}

message User {
    string login = 1;
}

message Repository {
    string full_name = 1;
}
