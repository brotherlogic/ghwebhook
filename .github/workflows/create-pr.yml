name: Create Pull Request
on:
  push:
    branches-ignore:
      - main

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Pull Request
        run: |
          REF_NAME="${{ github.ref_name }}"
          BODY="Automated PR created from push to ${REF_NAME}."
          if [[ "$REF_NAME" =~ [-_]([0-9]+)$ ]]; then
            ISSUE_NUM="${BASH_REMATCH[1]}"
            BODY="${BODY}

          Closes #${ISSUE_NUM}"
          fi
          gh pr create --base main --head "$REF_NAME" --title "PR for ${REF_NAME}" --body "$BODY" || echo "PR already exists"
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_TOKEN }}
