name: Create Pull Request
on:
  push:
    branches-ignore:
      - main

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Pull Request
        run: |
          gh pr create --base main --head ${{ github.ref_name }} --title "PR for ${{ github.ref_name }}" --body "Automated PR created from push to ${{ github.ref_name }}." || echo "PR already exists"
        env:
          GH_TOKEN: ${{ github.token }}
